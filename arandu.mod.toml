# What this package declares about itself.
#
# The declaration is capability, not intent: the package's own suite compares it
# with what the code calls, because `aru doctor` reads the application and never
# opens an installed package.

name = "hyz-is/avatar"
framework = ">= 0.67"
profiles = ["conventional", "performance"]

[permissions]
# One request, made when a person switches their Gravatar on or refreshes it:
# a GET to https://gravatar.com/avatar/<sha256 of the e-mail>. Only the digest
# leaves, never the e-mail, and nothing else is ever sent. Without Gravatar in
# Config.Chain no request is made.
network = true
# It opens no file of its own. The photos go to the Disk the application passes
# in Config.Files -- in production a private bucket -- under keys the server
# generates, and are read back only through an authorized route.
filesystem = false
# It runs no other program.
exec = false
# migrations.go owns the avatars table, so whoever installs this has to run
# `aru migrate`. Declaring it is how they find that out before deploying.
migrations = true
